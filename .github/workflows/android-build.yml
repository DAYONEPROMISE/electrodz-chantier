name: android-build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --console=plain

      - name: Lint
        run: gradle :app:lintDebug --console=plain

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --console=plain

      - name: Verify APK exists and is non-empty
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          test -s "$APK"
          echo "APK OK: $APK"
          ls -la "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: electrodz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
